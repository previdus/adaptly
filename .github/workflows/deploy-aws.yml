name: Deploy Adaptly to AWS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "drizzle/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "infra/aws/**"
      - "Dockerfile.aws-poc"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "next.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptly-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the AWS POC
    if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Build the app
        run: npm run build

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Refresh the Adaptly host through Systems Manager
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=adaptly-poc' 'Name=tag:app,Values=Adaptly' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          if [[ ! "$instance_id" =~ ^i-[a-f0-9]+$ ]]; then
            echo "Expected exactly one running EC2 instance tagged app=Adaptly and Name=adaptly-poc; found: ${instance_id:-none}." >&2
            exit 1
          fi

          remote_command='set -euo pipefail; cd /opt/adaptly; git fetch --depth=1 origin main; git reset --hard origin/main; bash scripts/deploy-aws-poc.sh'
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "Adaptly deployment ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --output json 2>/dev/null || true)"
            status="$(jq -r '.Status // "Pending"' <<< "$invocation")"
            case "$status" in
              Success)
                echo "Adaptly is healthy on ${instance_id}."
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                jq -r '.StatusDetails, .StandardErrorContent' <<< "$invocation" >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the AWS deployment command ${command_id}." >&2
          exit 1

  setup-required:
    name: AWS deployment access needs one-time setup
    if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain the one-time setup
        run: |
          {
            echo '### AWS deployment is not activated yet'
            echo 'Create the short-lived GitHub OIDC role from `infra/aws/github-actions-deploy-role.yaml`, then add its RoleArn output as the repository Actions variable `AWS_ROLE_TO_ASSUME`.'
            echo 'The setup guide is in the AWS deployment section of `README.md`.'
          } >> "$GITHUB_STEP_SUMMARY"
