name: Deploy Adaptly to AWS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "drizzle/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "infra/aws/**"
      - "Dockerfile.aws-poc"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "next.config.ts"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptly-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the AWS POC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Run ATDD/TDD test suite
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::248189923299:role/AdaptlyGitHubActionsDeployRole
          aws-region: us-east-1

      - name: Refresh the Adaptly host through Systems Manager
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=adaptly-poc' 'Name=tag:app,Values=Adaptly' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          if [[ ! "$instance_id" =~ ^i-[a-f0-9]+$ ]]; then
            echo "Expected exactly one running EC2 instance tagged app=Adaptly and Name=adaptly-poc; found: ${instance_id:-none}." >&2
            exit 1
          fi

          remote_command="$(cat <<'REMOTE'
          set -euo pipefail
          # Recover enough headroom to fetch the new preflight script even if the
          # previous build filled the host disk. Never prune persistent volumes.
          free_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          free_inodes=$(df -Pi / | awk 'NR == 2 {print $4}')
          if (( free_kb < 1048576 || free_inodes < 15000 )); then
            docker builder prune --all --force
            docker image prune --force
          fi
          cd /opt/adaptly
          git fetch --depth=1 origin main
          git reset --hard origin/main
          bash scripts/deploy-aws-poc.sh
          REMOTE
          )"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "Adaptly deployment ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --output json 2>/dev/null || true)"
            status="$(jq -r '.Status // "Pending"' <<< "$invocation")"
            case "$status" in
              Success)
                jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$invocation"
                echo "Adaptly is healthy on ${instance_id}."
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                jq -r '.StatusDetails, .StandardOutputContent, .StandardErrorContent' <<< "$invocation" >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the AWS deployment command ${command_id}." >&2
          exit 1
